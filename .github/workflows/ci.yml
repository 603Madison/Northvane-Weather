name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Unit tests, screenshot tests, lint, debug build
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-screenshots
          path: |
            app/build/outputs/screenshots/
            app/build/reports/lint-results-debug.html
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: northvane-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  live-services:
    # Weekly check that NWS / NOAA / IEM still behave the way the app expects.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :core:test -Pnorthvane.live=true
