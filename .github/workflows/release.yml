name: Release

# Push a tag like v1.0.0 to build and publish a GitHub release.
# Signing uses repository secrets (see docs/RELEASING.md). Without them the
# release is still created, but with a clearly named debug-signed APK.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.key.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PATH" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          ./gradlew --no-daemon :app:assembleRelease
          rm -f keystore.properties
          cp app/build/outputs/apk/release/app-release.apk "Northvane-${GITHUB_REF_NAME}.apk"

      - name: Build debug-signed APK (no signing key configured)
        if: steps.key.outputs.signed != 'true'
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "Northvane-${GITHUB_REF_NAME}-debug.apk"

      - name: Checksums and release notes
        run: |
          sha256sum Northvane-*.apk | tee SHA256SUMS.txt
          awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" tag "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md." > release-notes.md
          if [ "${{ steps.key.outputs.signed }}" != "true" ]; then
            printf '\n> **Debug-signed build.** No release signing key was configured, so this APK is signed with a debug key. It is fine for trying the app, but updates will require uninstalling first.\n' >> release-notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Northvane-*.apk SHA256SUMS.txt \
            --title "Northvane ${GITHUB_REF_NAME}" --notes-file release-notes.md \
            $(echo "$GITHUB_REF_NAME" | grep -q -- '-' && echo --prerelease)
